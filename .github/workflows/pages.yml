name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 20 = el mínimo documentado en engines; CI valida ese piso a propósito.
          node-version: 20
          cache: npm
      - run: npm ci
      # La suite es requisito del despliegue: si falla, no se publica.
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
        with:
          # Crea el sitio de Pages si aún no existe (fuente: GitHub Actions).
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
